services:
  tolaria-web:
    build: .
    image: tolaria-server:latest
    container_name: tolaria_web
    restart: unless-stopped
    environment:
      TOLARIA_VAULT_PATH: /vault
      TOLARIA_USERS_DB: /app/data/users.db
      TOLARIA_COOKIE_SECURE: ${TOLARIA_COOKIE_SECURE:-true}
      # Phase 5 git sync: fixed server committer identity for autogit/explicit
      # commits (author is always the acting user's own git_name/git_email).
      TOLARIA_COMMITTER_NAME: ${TOLARIA_COMMITTER_NAME:-Tolaria Server}
      TOLARIA_COMMITTER_EMAIL: ${TOLARIA_COMMITTER_EMAIL:-server@tolaria.local}
      # Auto-commit each write as the acting user. Set to false to disable
      # and rely solely on the explicit git_commit control.
      TOLARIA_AUTOGIT: ${TOLARIA_AUTOGIT:-true}
      # Credential for git push/pull to an SSH remote. The container runs as
      # root, so mount the key under /root/.ssh (see the volume below) and point
      # GIT_SSH_COMMAND's -i at it. Set GIT_SSH_COMMAND in your .env, e.g.:
      #   GIT_SSH_COMMAND=ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new
      # The vault clone must already have its remote configured (git remote add origin ...).
      GIT_SSH_COMMAND: ${GIT_SSH_COMMAND:-}
    volumes:
      # Mount a vault clone read-write into the container: Phase 4 write
      # commands (save/create/rename/delete/frontmatter) persist to disk here.
      - ${TOLARIA_VAULT_MOUNT:-./demo-vault-v2}:/vault
      # Persist the SQLite users DB (argon2 password hashes) across restarts.
      - tolaria_users:/app/data
      # SSH deploy key for push/pull. The container runs as root, so mount
      # under /root/.ssh and point GIT_SSH_COMMAND (.env) at this path.
      - ./secrets/deploy_key:/root/.ssh/id_ed25519:ro
    ports:
      # Bind to localhost only; the nginx edge (or host nginx) is the public listener.
      - "127.0.0.1:8787:8787"

  proxy:
    image: nginx:1.27-alpine
    container_name: tolaria_proxy
    profiles:
      - docker-edge
    restart: unless-stopped
    depends_on:
      - tolaria-web
    ports:
      - "${PROXY_BIND_HOST:-0.0.0.0}:${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  tolaria_users:
