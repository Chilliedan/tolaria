services:
  tolaria-web:
    build: .
    image: tolaria-server:latest
    container_name: tolaria_web
    restart: unless-stopped
    environment:
      TOLARIA_VAULT_PATH: /vault
      TOLARIA_USERS_DB: /app/data/users.db
      TOLARIA_COOKIE_SECURE: ${TOLARIA_COOKIE_SECURE:-true}
    volumes:
      # Mount a vault clone read-write into the container: Phase 4 write
      # commands (save/create/rename/delete/frontmatter) persist to disk here.
      - ${TOLARIA_VAULT_MOUNT:-./demo-vault-v2}:/vault
      # Persist the SQLite users DB (argon2 password hashes) across restarts.
      - tolaria_users:/app/data
    ports:
      # Bind to localhost only; the nginx edge (or host nginx) is the public listener.
      - "127.0.0.1:8787:8787"

  proxy:
    image: nginx:1.27-alpine
    container_name: tolaria_proxy
    profiles:
      - docker-edge
    restart: unless-stopped
    depends_on:
      - tolaria-web
    ports:
      - "${PROXY_BIND_HOST:-0.0.0.0}:${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  tolaria_users:
