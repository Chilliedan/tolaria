[package]
name = "tolaria-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-or-later"

[lib]
name = "tolaria_core"

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
gray_matter = "0.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
base64 = "0.22"
dirs = "5"
csv = "1.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
